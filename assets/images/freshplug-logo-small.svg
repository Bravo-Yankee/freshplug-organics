<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="20" cy="20" r="17" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
  
  <!-- Chicken Silhouette -->
  <g transform="translate(10, 12) scale(0.5)">
    <!-- Body -->
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#fff"/>
    <!-- Head -->
    <circle cx="35" cy="12" r="8" fill="#fff"/>
    <!-- Beak -->
    <polygon points="42,12 48,10 45,15" fill="#ffb74d"/>
    <!-- Eye -->
    <circle cx="38" cy="10" r="2" fill="#333"/>
    <!-- Comb -->
    <path d="M35,4 Q32,2 30,4 Q33,1 35,4 Q37,1 40,4 Q38,2 35,4" fill="#f44336"/>
    <!-- Wing -->
    <ellipse cx="18" cy="18" rx="8" ry="5" fill="#e8f5e8" opacity="0.8"/>
  </g>
  
  <!-- Company Name -->
  <g font-family="Arial, sans-serif">
    <!-- "FRESHPLUG" -->
    <text x="42" y="17" font-size="11" font-weight="bold" fill="#2e7d32">FRESHPLUG</text>
    <!-- "ORGANICS" -->
    <text x="42" y="28" font-size="7" font-weight="normal" fill="#4caf50" letter-spacing="0.5px">ORGANICS</text>
    <!-- "Poultry Farm" -->
    <text x="42" y="36" font-size="6" font-weight="normal" fill="#666">POULTRY FARM</text>
  </g>
</svg>